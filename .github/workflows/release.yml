name: Release

# Pushing a tag that equals manifest.json's version (for example 0.1.0, no "v") builds the plugin
# and creates a draft release with the three files Obsidian installs.
on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches manifest.json and versions.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"; exit 1; fi
          node -e "const v=require('./versions.json'); if (!v['$version']) { console.error('versions.json has no entry for $version'); process.exit(1) }"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "$GITHUB_REF_NAME" --generate-notes
