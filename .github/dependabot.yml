version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive together; each major update gets its own pull request.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native compiler, which typescript-eslint and node-llama-cpp do not support yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The Node types follow the oldest supported Node version, 22.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # CodeMirror is pinned to the versions the obsidian package requires; it moves with obsidian.
      - dependency-name: "@codemirror/*"
      # Oxfmt matches the version bundled in the engine repository's Vite+; it moves with that.
      - dependency-name: oxfmt
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
